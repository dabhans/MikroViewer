appId: app.mikroviewer
productName: MikroViewer
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: MikroViewer-Setup-${version}.${ext}
portable:
  artifactName: MikroViewer-${version}-portable.${ext}
mac:
  icon: build/icon.png
  target: dmg
linux:
  icon: build/icon.png
  target: AppImage
