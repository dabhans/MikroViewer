appId: app.mikroviewer
productName: MikroViewer
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: MikroViewer-Setup-${version}.${ext}
portable:
  artifactName: MikroViewer-${version}-portable.${ext}
# Updates are downloaded from the releases of this repository (see src/main/updater.ts).
publish:
  provider: github
  owner: dabhans
  repo: MikroViewer
  releaseType: release
mac:
  icon: build/icon.png
  target: dmg
linux:
  icon: build/icon.png
  target: AppImage
